name: Bot smoke test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check index.js && node --check src/bot.js && node --check src/server.js
      - run: |
          node index.js &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:3000/health
          curl -f http://localhost:3000/api/status
          kill $SERVER_PID
